<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="web/manifest.webmanifest">
<link rel="apple-touch-icon" href="web/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Tunebox">
<title>Tunebox wall</title>
<script src="web/shared/look.js"></script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' fill='%23111'/><circle cx='9' cy='12' r='6' fill='%23E63B2E'/><path d='M14 6l8 12h-8z' fill='%23F2C230'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="web/shared/wallpaper.css">
<link rel="stylesheet" href="web/wall/css/wall.css">
<link rel="stylesheet" href="web/shared/dialog.css">
<script src="web/shared/qrcode.js"></script>
<script type="module" src="web/wall/js/wall.js"></script>
</head>
<body class="idle">
<div class="wp" id="wp" aria-hidden="true"></div>
<div class="grain" id="grain" aria-hidden="true"></div>
<div class="stage nolyrics" id="stage">
  <div class="left">
    <div class="art" id="art"><img class="cover" id="cover" alt=""><i class="hint" id="hint"></i></div>
    <div><h1 class="title" id="title"></h1><div class="artist" id="artist"></div><div class="by" id="by" hidden></div></div>
    <div class="prog"><i id="fill"></i></div>
    <div class="times"><span id="pos">0:00</span><span id="dur">0:00</span></div>
    <div class="next" id="next" hidden></div>
    <div class="ctrls">
      <button data-act="prev" aria-label="Previous"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 4h3v16H5zM20 4v16L9 12z"/></svg></button>
      <button class="play" id="playBtn" data-act="toggle" aria-label="Play or pause"></button>
      <button data-act="next" aria-label="Next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 4h3v16h-3zM4 4v16l11-8z"/></svg></button>
      <button data-act="volume" data-d="-5" aria-label="Quieter"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l6 5V4L7 9z"/><path d="M16 11h6v2h-6z"/></svg></button>
      <span class="vol" id="vol"></span>
      <button data-act="volume" data-d="5" aria-label="Louder"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l6 5V4L7 9z"/><path d="M18 8h2v3h3v2h-3v3h-2v-3h-3v-2h3z"/></svg></button>
      <button class="like like-now" id="likeBtn" data-act="like" aria-label="Like"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/></svg></button>
    </div>
  </div>
  <div class="lyr" id="lyr" hidden><div class="in" id="lyrIn"></div></div>
</div>
<div class="clock" id="clock"><b id="time">--:--</b><span id="date"></span><small id="idleNote"></small></div>
<div class="join" id="join" hidden><div class="qr" id="qr"></div><span>Scan to add songs</span></div>
<div class="dim"></div>
<!-- top right, icons only: add songs, lyrics on or off, full screen, and leave (4 presses, so a passing hand doesn't) -->
<div class="corner">
  <button class="find-btn" data-act="find-open" aria-label="Add songs" title="Add songs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></button>
  <button class="lyr-btn" id="lyrBtn" data-act="lyrics-toggle" aria-label="Lyrics" title="Lyrics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h11M4 11h8M4 16h6"/><circle cx="16.5" cy="17.5" r="2.5"/><path d="M19 17.5V8l2.5-1"/><path class="off" d="M3 3l18 18"/></svg></button>
  <button data-act="fullscreen" id="fsBtn" aria-label="Full screen" title="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="fs-in" d="M15 3h6v6M21 3l-7 7M9 21H3v-6M3 21l7-7M3 9V3h6M3 3l7 7M21 15v6h-6M21 21l-7-7"/><path class="fs-out" d="M14 4v6h6M14 10l7-7M10 20v-6H4M10 14l-7 7M4 10h6V4M10 10 3 3M20 14h-6v6M14 14l7 7"/></svg></button>
  <button class="exit" id="exitBtn" data-act="exit" aria-label="Leave the wall (press 4 times)" title="Leave the wall (press 4 times)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg><b></b></button>
</div>
<div class="find" id="find" hidden role="dialog" aria-label="Add songs">
  <div class="fhead">
    <label class="fbar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="fq" type="search" placeholder="Search for a song" autocomplete="off" enterkeyhint="search"></label>
    <button class="fx" data-act="find-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="fwho"><div class="fwhom" id="fwho"></div><div class="fjoin" id="fjoin" hidden><span>Or add from your phone</span><div class="qr" id="fqr"></div></div></div>
  <div class="fres" id="fres"></div>
</div>
<div class="msg" id="msg"></div>
</body>
</html>
